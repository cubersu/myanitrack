# JVM ayarlari
#
# ONEMLI: -Dfile.encoding=windows-1252 bilerek verildi ve degistirilmemeli.
# Bu makinede kullanici dizini "C:\Users\Ömer" seklinde ASCII disi bir karakter
# iceriyor. JDK'nin sun.jnu.encoding degeri Cp1252; Gradle ise worker classpath
# argfile'ini daemon'un file.encoding degeriyle yaziyor. UTF-8 yazilan dosyayi
# java launcher'i Cp1252 olarak okuyunca yol "C:\Users\Ã–mer" haline geliyor ve
# test worker'lari "Could not find or load main class GradleWorkerMain" ile
# cokuyor. Daemon'u Cp1252 ile calistirmak iki tarafi hizaliyor.
# Kaynak dosyalar yine UTF-8 okunuyor (asagidaki javac/kotlinc ayarlari).
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=windows-1252

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
ksp.useKSP2=true
